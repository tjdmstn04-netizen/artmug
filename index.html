
<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Artmug Portfolio</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #fff;
  color: #222;
  font-family: Arial, "Noto Sans KR", sans-serif;
}
.page {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px 0 100px;
}
.section { width: 100%; margin: 90px 0; }
.section-title {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  margin: 0 0 25px;
}
.section-description {
  text-align: center;
  color: #555;
  font-size: 15px;
  line-height: 1.8;
  margin: -10px 20px 30px;
}
.slider { position: relative; width: 100%; }
.slider-window { width: 100%; overflow: hidden; }
.slider-track {
  display: flex;
  width: 100%;
  transition: transform 0.45s ease;
  will-change: transform;
}
.slider-page {
  flex: 0 0 100%;
  width: 100%;
  min-width: 0;
}
.slider.one .slider-page {
  display: grid;
  grid-template-columns: 1fr;
}
.slider.two .slider-page {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.slider.three .slider-page {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.slider.four .slider-page {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.slide { width: 100%; min-width: 0; }
.slide img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  border: 0;
}
.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #111;
}
.video-wrap video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #111;
}
.slider-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 30px;
  font-family: Arial, sans-serif;
  line-height: 44px;
  cursor: pointer;
  z-index: 20;
  transition: background 0.2s ease, opacity 0.2s ease;
}
.slider-button:hover { background: rgba(0,0,0,0.78); }
.slider-prev { left: 14px; }
.slider-next { right: 14px; }
.slider-counter {
  text-align: center;
  margin-top: 13px;
  color: #777;
  font-size: 13px;
  line-height: 1.4;
}
@media (max-width: 700px) {
  .page { width: 100%; padding-bottom: 60px; }
  .section { margin: 60px 0; }
  .section-title { font-size: 23px; margin-bottom: 20px; }
  .section-description { font-size: 14px; }
  .slider-button {
    width: 38px;
    height: 38px;
    font-size: 25px;
    line-height: 36px;
  }
  .slider-prev { left: 7px; }
  .slider-next { right: 7px; }
  .slider-counter { font-size: 12px; }
}
</style>

<script>
document.querySelectorAll(".slider").forEach(function(slider) {
  let files;

  try {
    files = JSON.parse(slider.dataset.files);
  } catch (error) {
    console.error("샘플 목록을 읽을 수 없습니다.", error);
    return;
  }

  const visible = Math.max(1, Number(slider.dataset.visible || 1));
  const type = slider.dataset.type || "image";
  let currentPage = 0;
  let activated = false;
  const totalPages = Math.ceil(files.length / visible);

  const windowEl = document.createElement("div");
  windowEl.className = "slider-window";

  const track = document.createElement("div");
  track.className = "slider-track";

  const pages = [];

  for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
    const page = document.createElement("div");
    page.className = "slider-page";

    const first = pageIndex * visible;
    const last = Math.min(first + visible, files.length);

    for (let i = first; i < last; i++) {
      const slide = document.createElement("div");
      slide.className = "slide";

      if (type === "video") {
        const wrap = document.createElement("div");
        wrap.className = "video-wrap";

        const video = document.createElement("video");
        video.controls = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "none";
        video.dataset.file = files[i];

        wrap.appendChild(video);
        slide.appendChild(wrap);
      } else {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.dataset.file = files[i];
        slide.appendChild(img);
      }

      page.appendChild(slide);
    }

    pages.push(page);
    track.appendChild(page);
  }

  windowEl.appendChild(track);
  slider.appendChild(windowEl);

  const prev = document.createElement("button");
  prev.className = "slider-button slider-prev";
  prev.type = "button";
  prev.textContent = "‹";
  prev.setAttribute("aria-label", "이전 샘플");
  slider.appendChild(prev);

  const next = document.createElement("button");
  next.className = "slider-button slider-next";
  next.type = "button";
  next.textContent = "›";
  next.setAttribute("aria-label", "다음 샘플");
  slider.appendChild(next);

  const counter = document.createElement("div");
  counter.className = "slider-counter";
  slider.appendChild(counter);

  function loadPage(pageIndex) {
    if (!activated || !pages[pageIndex]) return;

    pages[pageIndex].querySelectorAll("img[data-file]").forEach(function(img) {
      if (!img.getAttribute("src")) {
        img.src = encodeURI(img.dataset.file);
      }
    });

    pages[pageIndex].querySelectorAll("video[data-file]").forEach(function(video) {
      if (!video.getAttribute("src")) {
        video.src = encodeURI(video.dataset.file);
        video.load();
      }
    });
  }

  function pauseVideosOutsideCurrentPage() {
    slider.querySelectorAll("video").forEach(function(video) {
      if (!pages[currentPage] || !pages[currentPage].contains(video)) {
        video.pause();
      }
    });
  }

  function update() {
    if (totalPages === 0) return;

    if (currentPage < 0) currentPage = totalPages - 1;
    if (currentPage >= totalPages) currentPage = 0;

    track.style.transform = "translateX(-" + (currentPage * 100) + "%)";
    counter.textContent = (currentPage + 1) + " / " + totalPages;

    pauseVideosOutsideCurrentPage();
    loadPage(currentPage);
  }

  function goToPage(pageIndex) {
    currentPage = pageIndex;
    activated = true;
    update();
  }

  prev.addEventListener("click", function() {
    goToPage(currentPage - 1);
  });

  next.addEventListener("click", function() {
    goToPage(currentPage + 1);
  });

  let touchStartX = 0;

  slider.addEventListener("touchstart", function(event) {
    touchStartX = event.changedTouches[0].screenX;
  }, { passive: true });

  slider.addEventListener("touchend", function(event) {
    const distance = event.changedTouches[0].screenX - touchStartX;
    if (Math.abs(distance) < 50) return;

    goToPage(distance < 0 ? currentPage + 1 : currentPage - 1);
  }, { passive: true });

  update();

  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          activated = true;
          loadPage(currentPage);
          observer.disconnect();
        }
      });
    }, { rootMargin: "500px 0px" });

    observer.observe(slider);
  } else {
    activated = true;
    loadPage(currentPage);
  }
});
</script>
