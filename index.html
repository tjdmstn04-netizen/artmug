<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #ffffff;
    color: #222222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}


/* =========================
   전체 페이지
========================= */

.page {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 0 100px;
}


/* =========================
   섹션
========================= */

.section {
    width: 100%;
    margin: 90px 0;
}

.section-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 25px;
}

.section-description {
    text-align: center;
    color: #555555;
    font-size: 15px;
    line-height: 1.8;
    margin: -10px 20px 30px;
}


/* =========================
   슬라이더
========================= */

.slider {
    position: relative;
    width: 100%;
}

.slider-window {
    width: 100%;
    overflow: hidden;
}

.slider-track {
    display: flex;
    width: 100%;
    transition: transform 0.45s ease;
    will-change: transform;
}


/* 기본: 1장씩 */

.slide {
    flex: 0 0 100%;
    width: 100%;
    min-width: 0;
}


/* 2장씩 */

.slider.two .slide {
    flex: 0 0 50%;
    width: 50%;
}


/* =========================
   이미지
========================= */

.slide img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    cursor: zoom-in;
}


/* 2장 슬라이더 간격 */

.slider.two .slide:nth-child(odd) {
    padding-right: 5px;
}

.slider.two .slide:nth-child(even) {
    padding-left: 5px;
}


/* =========================
   영상
========================= */

.video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111111;
}

.video-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111111;
}


/* =========================
   이전 / 다음 버튼
========================= */

.slider-button {
    position: absolute;

    top: 50%;
    transform: translateY(-50%);

    width: 46px;
    height: 46px;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;

    font-size: 30px;
    font-family: Arial, sans-serif;
    line-height: 44px;

    cursor: pointer;

    z-index: 20;

    transition:
        background 0.2s ease,
        opacity 0.2s ease;
}

.slider-button:hover {
    background: rgba(0, 0, 0, 0.78);
}

.slider-prev {
    left: 14px;
}

.slider-next {
    right: 14px;
}


/* =========================
   페이지 번호
========================= */

.slider-counter {
    text-align: center;

    margin-top: 13px;

    color: #777777;

    font-size: 13px;
    line-height: 1.4;
}


/* =========================
   이미지 확대
========================= */

.lightbox {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 30px;

    background: rgba(0, 0, 0, 0.90);

    z-index: 99999;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    display: block;

    max-width: 95vw;
    max-height: 92vh;

    width: auto;
    height: auto;

    object-fit: contain;
}

.lightbox-close {
    position: fixed;

    top: 15px;
    right: 24px;

    border: none;

    padding: 0;

    color: white;
    background: transparent;

    font-size: 46px;
    line-height: 1;

    cursor: pointer;
}


/* =========================
   모바일
========================= */

@media (max-width: 700px) {

    .page {
        width: 100%;
        padding-bottom: 60px;
    }

    .section {
        margin: 60px 0;
    }

    .section-title {
        font-size: 23px;
        margin-bottom: 20px;
    }

        font-size: 14px;
    }

    .slider-button {
        width: 38px;
        height: 38px;

        font-size: 25px;
        line-height: 36px;
    }

    .slider-prev {
        left: 7px;
    }

    .slider-next {
        right: 7px;
    }

    .slider-counter {
        font-size: 12px;
    }

}

</style>
</head>

<script>

/* =====================================================
   모든 슬라이더 생성
===================================================== */

document.querySelectorAll(".slider").forEach(function(slider) {

    const files =
        JSON.parse(slider.dataset.files);

    const visible =
        Number(slider.dataset.visible || 1);

    const type =
        slider.dataset.type || "image";


    /* 현재 첫 번째 아이템 번호 */
    let current = 0;


    /* 슬라이더 창 */
    const windowEl =
        document.createElement("div");

    windowEl.className =
        "slider-window";


    /* 실제로 이동하는 트랙 */
    const track =
        document.createElement("div");

    track.className =
        "slider-track";


    /* =================================================
       아이템 생성
    ================================================= */

    files.forEach(function(file) {

        const slide =
            document.createElement("div");

        slide.className =
            "slide";


        /* 영상 */
        if (type === "video") {

            const wrap =
                document.createElement("div");

            wrap.className =
                "video-wrap";


            const video =
                document.createElement("video");

            video.src =
                encodeURI(file);

            video.controls =
                true;

            video.loop =
                true;

            video.playsInline =
                true;

            video.preload =
                "metadata";


            wrap.appendChild(video);

            slide.appendChild(wrap);

        }


        /* 이미지 */
        else {

            const img =
                document.createElement("img");

            img.src =
                encodeURI(file);

            img.alt =
                "";

            img.loading =
                "lazy";


            img.addEventListener(
                "click",
                function() {

                    openLightbox(
                        encodeURI(file)
                    );

                }
            );


            slide.appendChild(img);

        }


        track.appendChild(slide);

    });


    windowEl.appendChild(track);

    slider.appendChild(windowEl);



    /* =================================================
       이전 버튼
    ================================================= */

    const prev =
        document.createElement("button");

    prev.className =
        "slider-button slider-prev";

    prev.type =
        "button";

    prev.innerHTML =
        "‹";

    prev.setAttribute(
        "aria-label",
        "이전 샘플"
    );


    slider.appendChild(prev);



    /* =================================================
       다음 버튼
    ================================================= */

    const next =
        document.createElement("button");

    next.className =
        "slider-button slider-next";

    next.type =
        "button";

    next.innerHTML =
        "›";

    next.setAttribute(
        "aria-label",
        "다음 샘플"
    );


    slider.appendChild(next);



    /* =================================================
       페이지 표시
    ================================================= */

    const counter =
        document.createElement("div");

    counter.className =
        "slider-counter";

    slider.appendChild(counter);



    /* =================================================
       페이지 수
    ================================================= */

    const totalPages =
        Math.ceil(files.length / visible);



    /* =================================================
       현재 슬라이드 업데이트
    ================================================= */

    function update() {

        /* 처음보다 뒤로 갔을 때 */
        if (current < 0) {

            current =
                (totalPages - 1) * visible;

        }


        /* 끝을 넘었을 때 */
        if (current >= files.length) {

            current = 0;

        }


        /* 이동 거리 */
        const movePercent =
            current * (100 / visible);


        track.style.transform =
            "translateX(-" +
            movePercent +
            "%)";


        /* -------------------------
           1장씩 표시
        ------------------------- */

        if (visible === 1) {

            const page =
                Math.floor(
                    current / visible
                ) + 1;


            counter.textContent =
                page +
                " / " +
                totalPages;

        }


        /* -------------------------
           2장씩 표시
        ------------------------- */

        else {

            const page =
                Math.floor(
                    current / visible
                ) + 1;


            counter.textContent =
                page +
                " / " +
                totalPages;

        }

    }



    /* =================================================
       버튼 동작

       ★ visible만큼 이동하기 때문에

       visible = 1
       → 한 장 이동

       visible = 2
       → 두 장 이동
    ================================================= */

    prev.addEventListener(
        "click",
        function() {

            current -= visible;

            pauseVideos();

            update();

        }
    );


    next.addEventListener(
        "click",
        function() {

            current += visible;

            pauseVideos();

            update();

        }
    );



    /* =================================================
       모바일 스와이프
    ================================================= */

    let touchStartX = 0;
    let touchEndX = 0;


    slider.addEventListener(
        "touchstart",
        function(e) {

            touchStartX =
                e.changedTouches[0].screenX;

        },
        {
            passive: true
        }
    );


    slider.addEventListener(
        "touchend",
        function(e) {

            touchEndX =
                e.changedTouches[0].screenX;


            const distance =
                touchEndX -
                touchStartX;


            /* 작은 움직임 무시 */
            if (
                Math.abs(distance) < 50
            ) {

                return;

            }


            /* 왼쪽으로 밀기 */
            if (distance < 0) {

                current += visible;

            }


            /* 오른쪽으로 밀기 */
            else {

                current -= visible;

            }


            pauseVideos();

            update();

        },
        {
            passive: true
        }
    );



    /* =================================================
       다른 페이지로 넘어갈 때
       재생 중인 영상 정지
    ================================================= */

    function pauseVideos() {

        slider
            .querySelectorAll("video")
            .forEach(function(video) {

                video.pause();

            });

    }



    /* 최초 표시 */
    update();

});



/* =====================================================
   이미지 확대
===================================================== */

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightbox-image"
    );

const lightboxClose =
    document.getElementById(
        "lightbox-close"
    );



function openLightbox(src) {

    lightboxImage.src =
        src;

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}



function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    lightboxImage.src =
        "";

    document.body.style.overflow =
        "";

}



lightboxClose.addEventListener(
    "click",
    closeLightbox
);



lightbox.addEventListener(
    "click",
    function(e) {

        if (
            e.target === lightbox
        ) {

            closeLightbox();

        }

    }
);



document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);

</script>
