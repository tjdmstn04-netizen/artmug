<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #ffffff;
    color: #222222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}


/* =========================
   전체 페이지
========================= */

.page {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 0 100px;
}


/* =========================
   섹션
========================= */

.section {
    width: 100%;
    margin: 90px 0;
}

.section-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 25px;
}

.section-description {
    text-align: center;
    color: #555555;
    font-size: 15px;
    line-height: 1.8;
    margin: -10px 20px 30px;
}


/* =========================
   슬라이더
========================= */

.slider {
    position: relative;
    width: 100%;
}

.slider-window {
    width: 100%;
    overflow: hidden;
}

.slider-track {
    display: flex;
    width: 100%;
    transition: transform 0.45s ease;
    will-change: transform;
}

.slider-page {
    flex: 0 0 100%;
    width: 100%;
    min-width: 0;
}


/* =========================
   1개
========================= */

.slider.one .slider-page {
    display: grid;
    grid-template-columns: 1fr;
}


/* =========================
   2개
========================= */

.slider.two .slider-page {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}


/* =========================
   3개
========================= */

.slider.three .slider-page {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
}


/* =========================
   4개
   1 2
   3 4
========================= */

.slider.four .slider-page {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}


/* =========================
   이미지
========================= */

.slide {
    width: 100%;
    min-width: 0;
}

.slide img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
}


/* =========================
   영상
========================= */

.video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111111;
}

.video-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111111;
}


/* =========================
   이전 / 다음 버튼
========================= */

.slider-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);

    width: 46px;
    height: 46px;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;

    font-size: 30px;
    font-family: Arial, sans-serif;
    line-height: 44px;

    cursor: pointer;

    z-index: 20;

    transition:
        background 0.2s ease,
        opacity 0.2s ease;
}

.slider-button:hover {
    background: rgba(0, 0, 0, 0.78);
}

.slider-prev {
    left: 14px;
}

.slider-next {
    right: 14px;
}


/* =========================
   페이지 번호
========================= */

.slider-counter {
    text-align: center;
    margin-top: 13px;
    color: #777777;
    font-size: 13px;
    line-height: 1.4;
}


/* =========================
   모바일
========================= */

@media (max-width: 700px) {

    .page {
        width: 100%;
        padding-bottom: 60px;
    }

        margin: 60px 0;
    }

    }

    .slider-prev {
        left: 7px;
    }

    .slider-next {
        right: 7px;
    }

    .slider-counter {
        font-size: 12px;
    }

}

</style>
</head>

<script>

/* =====================================================
   모든 슬라이더 생성
===================================================== */

document.querySelectorAll(".slider").forEach(function(slider) {

    const files =
        JSON.parse(slider.dataset.files);

    const visible =
        Number(slider.dataset.visible || 1);

    const type =
        slider.dataset.type || "image";

    let currentPage = 0;

    const totalPages =
        Math.ceil(files.length / visible);


    /* =========================
       슬라이더 창
    ========================= */

    const windowEl =
        document.createElement("div");

    windowEl.className =
        "slider-window";


    const track =
        document.createElement("div");

    track.className =
        "slider-track";


    /* =========================
       페이지 생성
    ========================= */

    for (
        let pageIndex = 0;
        pageIndex < totalPages;
        pageIndex++
    ) {

        const page =
            document.createElement("div");

        page.className =
            "slider-page";


        const start =
            pageIndex * visible;

        const end =
            Math.min(
                start + visible,
                files.length
            );


        for (
            let i = start;
            i < end;
            i++
        ) {

            const file =
                files[i];


            const slide =
                document.createElement("div");

            slide.className =
                "slide";


            /* =========================
               영상
            ========================= */

            if (type === "video") {

                const wrap =
                    document.createElement("div");

                wrap.className =
                    "video-wrap";


                const video =
                    document.createElement("video");

                video.src =
                    encodeURI(file);

                video.controls =
                    true;

                video.loop =
                    true;

                video.playsInline =
                    true;

                video.preload =
                    "metadata";


                wrap.appendChild(
                    video
                );

                slide.appendChild(
                    wrap
                );

            }


            /* =========================
               이미지
               확대 기능 없음
            ========================= */

            else {

                const img =
                    document.createElement("img");

                img.src =
                    encodeURI(file);

                img.alt =
                    "";

                img.loading =
                    "lazy";


                slide.appendChild(
                    img
                );

            }


            page.appendChild(
                slide
            );

        }


        track.appendChild(
            page
        );

    }


    windowEl.appendChild(
        track
    );

    slider.appendChild(
        windowEl
    );


    /* =========================
       이전 버튼
    ========================= */

    const prev =
        document.createElement("button");

    prev.className =
        "slider-button slider-prev";

    prev.type =
        "button";

    prev.innerHTML =
        "‹";

    prev.setAttribute(
        "aria-label",
        "이전 샘플"
    );

    slider.appendChild(
        prev
    );


    /* =========================
       다음 버튼
    ========================= */

    const next =
        document.createElement("button");

    next.className =
        "slider-button slider-next";

    next.type =
        "button";

    next.innerHTML =
        "›";

    next.setAttribute(
        "aria-label",
        "다음 샘플"
    );

    slider.appendChild(
        next
    );


    /* =========================
       페이지 번호
    ========================= */

    const counter =
        document.createElement("div");

    counter.className =
        "slider-counter";

    slider.appendChild(
        counter
    );


    /* =========================
       업데이트
    ========================= */

    function update() {

        if (currentPage < 0) {

            currentPage =
                totalPages - 1;

        }


        if (
            currentPage >= totalPages
        ) {

            currentPage = 0;

        }


        track.style.transform =
            "translateX(-" +
            (currentPage * 100) +
            "%)";


        counter.textContent =
            (currentPage + 1) +
            " / " +
            totalPages;

    }


    /* =========================
       영상 정지
    ========================= */

    function pauseVideos() {

        slider
            .querySelectorAll("video")
            .forEach(function(video) {

                video.pause();

            });

    }


    /* =========================
       이전 버튼
    ========================= */

    prev.addEventListener(
        "click",
        function() {

            currentPage--;

            pauseVideos();

            update();

        }
    );


    /* =========================
       다음 버튼
    ========================= */

    next.addEventListener(
        "click",
        function() {

            currentPage++;

            pauseVideos();

            update();

        }
    );


    /* =========================
       모바일 스와이프
    ========================= */

    let touchStartX = 0;
    let touchEndX = 0;


    slider.addEventListener(
        "touchstart",
        function(e) {

            touchStartX =
                e.changedTouches[0].screenX;

        },
        {
            passive: true
        }
    );


    slider.addEventListener(
        "touchend",
        function(e) {

            touchEndX =
                e.changedTouches[0].screenX;


            const distance =
                touchEndX -
                touchStartX;


            if (
                Math.abs(distance) < 50
            ) {

                return;

            }


            if (distance < 0) {

                currentPage++;

            }

            else {

                currentPage--;

            }


            pauseVideos();

            update();

        },
        {
            passive: true
        }
    );


    /* 최초 표시 */

    update();

});

</script>
