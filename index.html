<title>Artmug Portfolio</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    background: #ffffff;
    color: #222;
    font-family: Arial, "Noto Sans KR", sans-serif;
}

/* 전체 페이지 */
.page {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-bottom: 100px;
}

/* 섹션 */
.section {
    margin: 90px 0;
}

.section-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 25px;
}

.section-description {
    text-align: center;
    font-size: 15px;
    line-height: 1.8;
    margin: -10px 20px 30px;
    color: #555;
}

/* =========================
   슬라이더
========================= */

.slider {
    position: relative;
    width: 100%;
    overflow: hidden;
}

.slider-window {
    width: 100%;
    overflow: hidden;
}

.slider-track {
    display: flex;
    transition: transform 0.45s ease;
    will-change: transform;
}

/* 기본 1장 */
.slide {
    flex: 0 0 100%;
    min-width: 0;
    padding: 0 4px;
}

/* 두 장 표시 */
.slider.two .slide {
    flex: 0 0 50%;
}

/* 이미지 */
.slide img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
}

/* 영상 */
.video-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
}

.video-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111;
}

/* 좌우 버튼 */
.slider-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.58);
    color: white;
    font-size: 29px;
    line-height: 46px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
    opacity: 0.85;
}

.slider-button:hover {
    opacity: 1;
}

.slider-prev {
    left: 14px;
}

.slider-next {
    right: 14px;
}

/* 현재 페이지 표시 */
.slider-counter {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: #777;
}

/* =========================
   이미지 확대 모달
========================= */

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 30px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 92vh;
    object-fit: contain;
}

.lightbox-close {
    position: fixed;
    top: 18px;
    right: 25px;
    border: 0;
    background: transparent;
    color: white;
    font-size: 42px;
    cursor: pointer;
}

/* 모바일 */
@media (max-width: 700px) {
    .page {
        width: 100%;
    }

    .section {
        margin: 60px 0;
    }

    .section-title {
        font-size: 23px;
    }

    .slider-button {
        width: 38px;
        height: 38px;
        line-height: 38px;
        font-size: 24px;
    }

    .slider-prev {
        left: 7px;
    }

    .slider-next {
        right: 7px;
    }
}
</style>
</head>

<!-- 이미지 확대 -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">×</button>
    <img id="lightbox-image" src="" alt="">
</div>


<script>

/* =========================================
   슬라이더 생성
========================================= */

document.querySelectorAll(".slider").forEach(function(slider) {

    const files = JSON.parse(slider.dataset.files);
    const visible = Number(slider.dataset.visible || 1);
    const type = slider.dataset.type || "image";

    let current = 0;

    const windowEl = document.createElement("div");
    windowEl.className = "slider-window";

    const track = document.createElement("div");
    track.className = "slider-track";


    /* 아이템 생성 */
    files.forEach(function(file) {

        const slide = document.createElement("div");
        slide.className = "slide";


        if (type === "video") {

            const wrap = document.createElement("div");
            wrap.className = "video-wrap";

            const video = document.createElement("video");
            video.src = file;
            video.controls = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = "metadata";

            wrap.appendChild(video);
            slide.appendChild(wrap);

        } else {

            const img = document.createElement("img");

            img.src = file;
            img.alt = "";
            img.loading = "lazy";

            img.addEventListener("click", function() {
                openLightbox(file);
            });

            slide.appendChild(img);

        }

        track.appendChild(slide);

    });


    windowEl.appendChild(track);
    slider.appendChild(windowEl);


    /* 이전 버튼 */
    const prev = document.createElement("button");

    prev.className = "slider-button slider-prev";
    prev.type = "button";
    prev.innerHTML = "‹";

    slider.appendChild(prev);


    /* 다음 버튼 */
    const next = document.createElement("button");

    next.className = "slider-button slider-next";
    next.type = "button";
    next.innerHTML = "›";

    slider.appendChild(next);


    /* 카운터 */
    const counter = document.createElement("div");

    counter.className = "slider-counter";

    slider.appendChild(counter);


    function maxIndex() {
        return Math.max(0, files.length - visible);
    }


    function update() {

        if (current < 0) {
            current = maxIndex();
        }

        if (current > maxIndex()) {
            current = 0;
        }

        const movePercent = current * (100 / visible);

        track.style.transform =
            "translateX(-" + movePercent + "%)";


        if (visible === 1) {

            counter.textContent =
                (current + 1) + " / " + files.length;

        } else {

            const first = current + 1;
            const last = Math.min(
                current + visible,
                files.length
            );

            counter.textContent =
                first + "–" + last + " / " + files.length;
        }

    }


    prev.addEventListener("click", function() {

        current--;

        update();

    });


    next.addEventListener("click", function() {

        current++;

        update();

    });


    /* 터치 스와이프 */
    let touchStartX = 0;
    let touchEndX = 0;

    slider.addEventListener(
        "touchstart",
        function(e) {
            touchStartX = e.changedTouches[0].screenX;
        },
        {passive:true}
    );

    slider.addEventListener(
        "touchend",
        function(e) {

            touchEndX = e.changedTouches[0].screenX;

            const distance = touchEndX - touchStartX;

            if (Math.abs(distance) < 50) {
                return;
            }

            if (distance < 0) {
                current++;
            } else {
                current--;
            }

            update();

        },
        {passive:true}
    );


    update();

});


/* =========================================
   이미지 확대
========================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightbox-image");

const lightboxClose =
    document.getElementById("lightbox-close");


function openLightbox(src) {

    lightboxImage.src = src;
    lightbox.classList.add("active");

}


function closeLightbox() {

    lightbox.classList.remove("active");
    lightboxImage.src = "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    function(e) {

        if (e.target === lightbox) {
            closeLightbox();
        }

    }
);


document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {
            closeLightbox();
        }

    }
);

</script>
